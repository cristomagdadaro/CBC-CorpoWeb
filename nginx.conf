# Nginx configuration for WordPress (CBC-CorpoWeb)
# -----------------------------------------------------------------------------
# This file is a hardened, production-oriented example. Adjust paths/certs/user.
# Place as /etc/nginx/sites-available/cbc-corpo-web.conf (Linux) and symlink to
# /etc/nginx/sites-enabled/. On Windows (if using Nginx), adapt paths accordingly.
# -----------------------------------------------------------------------------
# Assumptions:
# - Site files located at: /var/www/cbc-corpo-web (change `root` as needed)
# - PHP-FPM socket at: unix:/run/php/php8.1-fpm.sock (adjust for your PHP version)
# - SSL certs from Let's Encrypt at: /etc/letsencrypt/live/example.com/
# - Primary domain: example.com (replace everywhere)
# -----------------------------------------------------------------------------
# Recommended complementary system settings (outside of Nginx):
# - Tune fastcgi buffers if large pages: fastcgi_buffers 16 16k; fastcgi_buffer_size 32k;
# - Ensure proper file ownership: www-data:www-data
# - Keep WordPress + plugins updated
# -----------------------------------------------------------------------------

# -----------------------------
# Global limits & maps (in http{} context; if placing inside main nginx.conf,
# move these there. If this file is included directly inside http{}, it's fine.)
# -----------------------------
map $http_user_agent $blocked_ua {
    default 0;
    ~*(malicious|badbot|crawler4|grabber) 1;
}

# Simple rate limiting zones (tune to your traffic)
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;   # login form
limit_req_zone $binary_remote_addr zone=xmlrpc_zone:10m rate=20r/m;  # xmlrpc
limit_req_zone $binary_remote_addr zone=wpcommon_zone:10m rate=200r/m; # generic

# Cache for PHP-FPM responses to improve performance of repeating queries
fastcgi_cache_path /var/cache/nginx/fastcgi levels=1:2 keys_zone=PHPFCGI:100m inactive=60m use_temp_path=off;
fastcgi_cache_key "$scheme$request_method$host$request_uri";

# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name example.com www.example.com;
    root /var/www/cbc-corpo-web;          # Adjust to your deployment path
    index index.php index.html;

    # Enforce HTTPS
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; allow all; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name example.com www.example.com;
    root /var/www/cbc-corpo-web;
    index index.php index.html;

    # ---------------- SSL (replace with real cert/key) ----------------
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/example.com/chain.pem;

    # Modern TLS settings (adjust for compatibility as needed)
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256';

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 valid=300s; resolver_timeout 5s;

    # ---------------- Security Headers ----------------
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(),camera=(),geolocation=(),gyroscope=(),magnetometer=(),microphone=(),fullscreen=(self),payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # Adjust CSP as needed; this is a safe baseline allowing inline WP styles/scripts hashed automatically if using plugins.
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data: blob:; style-src 'self' https: 'unsafe-inline'; script-src 'self' https: 'unsafe-inline' 'unsafe-eval'; font-src 'self' https: data:; frame-ancestors 'self';" always;

    # ---------------- Basic Hardening ----------------
    if ($blocked_ua) { return 403; }

    client_max_body_size 64m;                # Allow media uploads
    client_body_timeout 60s;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip / Brotli (enable one; Brotli requires module)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml application/rss+xml image/svg+xml;
    gzip_min_length 1024;

    # Logging (tune/rotate via logrotate)
    access_log /var/log/nginx/cbc_corpo_web_access.log;
    error_log  /var/log/nginx/cbc_corpo_web_error.log warn;

    # ---------------- Locations ----------------

    # Static file caching
    location ~* \.(?:css|js|mjs|gif|jpe?g|png|svg|webp|ico|avif)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri $uri/ @wordpress;
    }

    location ~* \.(?:woff2?|ttf|otf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Deny access to sensitive files
    location ~* /(wp-config\.php|readme\.html|license\.txt|composer\.(json|lock)) { deny all; }
    location ~* /\.env { deny all; }
    location ~* /\.git { deny all; }

    # Block direct PHP in uploads (common malware vector)
    location ~* /wp-content/uploads/.*\.php$ { deny all; }

    # XML-RPC rate limiting (optional; many sites disable entirely)
    location = /xmlrpc.php {
        limit_req zone=xmlrpc_zone burst=5 nodelay;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Limit login POST brute force
    location = /wp-login.php {
        limit_req zone=login_zone burst=10 nodelay;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PHP_ADMIN_VALUE "open_basedir=$document_root:/tmp";
        fastcgi_intercept_errors on;
    }

    # Let WordPress handle other PHP
    location ~ \.php$ {
        limit_req zone=wpcommon_zone burst=50 nodelay;
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;  # adjust
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PHP_VALUE "upload_max_filesize=64M \n post_max_size=64M \n max_execution_time=120";
        fastcgi_param PHP_ADMIN_VALUE "open_basedir=$document_root:/tmp";
        fastcgi_buffering on;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_temp_file_write_size 64k;

        # FastCGI micro cache (optional; ensure cache safe if dynamic user cookies exist)
        set $no_cache 0;
        if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_logged_in") { set $no_cache 1; }
        fastcgi_cache_bypass $no_cache;
        fastcgi_no_cache $no_cache;
        fastcgi_cache PHPFCGI;
        fastcgi_cache_valid 200 301 302 10m;
        fastcgi_cache_valid 404 1m;
        add_header X-FastCGI-Cache $upstream_cache_status;
    }

    # WordPress main rewrite
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Fallback named location for static handler above
    location @wordpress {
        rewrite ^ /index.php?$args last;
    }

    # Security: deny hidden files and backup files
    location ~* /(.*)\.bak$ { deny all; }
    location ~* /(.*)\.swp$ { deny all; }
    location ~* /\.(?!well-known) { deny all; }

    # Expose only needed methods
    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS)$ ) { return 405; }

    # Optional: enable real IP if behind proxy/load balancer
    # set_real_ip_from  10.0.0.0/8;  # internal LB subnet
    # real_ip_header    X-Forwarded-For;
    # real_ip_recursive on;

    # Error pages
    error_page 403 /403.html;
    error_page 404 /404.html;
    location = /403.html { internal; }
    location = /404.html { internal; }
}

# ---------------- Additional Hardening Suggestions (Not active) ----------------
# 1. Disable XML-RPC entirely:
# location = /xmlrpc.php { deny all; }
# 2. Add fail2ban filters for nginx logs.
# 3. Use a Web Application Firewall (ModSecurity / Cloud WAF) for extra protection.
# 4. Remove 'unsafe-inline' and 'unsafe-eval' from CSP after auditing plugins.
# 5. Implement separate /assets build pipeline and longer immutable caching.
